<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Table</title>
    <style>
        table,tr,td,th{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <div>
        <table>
           <tr>
            <th colspan="6">TIME TABLE</th>
           
           </tr>
           <tr>
            <th rowspan="6">Hours</th>
            <td>Monday</td>
            <td>Tuesday</td>
            <td>Wednesday</td>
            <td>Thursday</td>
            <td>Friday</td>
           </tr>
           <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Hindi</td>
            <td>English</td>
            <td>Sanskrit</td>
           </tr>
           <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Hindi</td>
            <td>English</td>
            <td>Sanskrit</td>
           </tr>
           <tr>
            <th colspan="5">Lunch</th>
           </tr>
           <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Hindi</td>
            <td>English</td>
            <th rowspan="2">Project</th>
           </tr>
           <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Hindi</td>
            <td>English</td>
           </tr>
        </table>
    </div>
</body>
</html>
